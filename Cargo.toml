[package]
name = "datafusion-jev"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Typed Jev decisions in DataFusion SQL"

[dependencies]
datafusion = { version = "55", default-features = false, features = ["sql", "nested_expressions"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
